<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Launch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #05060a;
      --ink: #f4efe4;
      --muted: rgba(244, 239, 228, .62);
      --gold-1: #f6dc8f;
      --gold-2: #c8963e;
      --gold-3: #9c6b1c;
      --glass: rgba(14, 17, 30, .58);
      --line: rgba(243, 214, 138, .22);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "Inter", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans)
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #05060a;
      opacity: 0;
      /* fades in once the first real frame is drawn — no blank/black pop on start */
      transition: opacity 1.2s ease
    }

    #scene.ready {
      opacity: 1
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 68%, rgba(0, 0, 0, .45) 100%)
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;
      /* static: an animated, blended full-screen layer forces a repaint over the WebGL canvas every frame */
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .countdown.gold-text {
      animation: none;
      will-change: transform, opacity
    }

    @keyframes grain {
      0% {
        transform: translate(0, 0)
      }

      50% {
        transform: translate(-3%, 2%)
      }

      100% {
        transform: translate(2%, -3%)
      }
    }

    .gold-text {
      background: linear-gradient(100deg, var(--gold-3) 0%, var(--gold-1) 30%, var(--gold-2) 55%, var(--gold-1) 80%, var(--gold-3) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 6s linear infinite
    }

    @keyframes sheen {
      to {
        background-position: -200% 0
      }
    }

    .eyebrow {
      font: 500 11px/1 var(--sans);
      letter-spacing: .38em;
      text-transform: uppercase;
      color: var(--gold-1);
      opacity: .9
    }

    /* top bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px clamp(16px, 3vw, 36px);
      z-index: 20;
      pointer-events: none
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 500 11px var(--sans);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .brand .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-1);
      box-shadow: 0 0 12px var(--gold-1);
      animation: blink 2.4s ease-in-out infinite
    }

    @keyframes blink {
      50% {
        opacity: .35
      }
    }

    .icon-btn {
      pointer-events: auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: border-color .3s, transform .3s
    }

    .icon-btn:hover {
      border-color: var(--gold-1);
      transform: scale(1.06)
    }

    .icon-btn svg {
      width: 18px;
      height: 18px
    }

    /* intro */
    .intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
      z-index: 10;
      pointer-events: none
    }

    /* launch-screen background picture (CONFIG.launchBackground) */
    .intro-bg {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: none;
      background-color: #170a36;
      background-size: cover;
      background-position: center
    }

    .intro-bg::after {
      /* soft dark fade at the bottom so the launch text and button read clearly */
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 52%, rgba(12, 4, 32, .55) 74%, rgba(8, 3, 22, .85) 100%)
    }

    body.with-bg .intro-bg {
      display: block
    }

    /* the picture already carries the logos and the event title — keep only the launch details */
    body.with-bg .intro {
      justify-content: flex-end;
      padding-bottom: clamp(80px, 15vh, 170px)
    }

    body.with-bg .intro-chip,
    body.with-bg .intro h1,
    body.with-bg .intro-theme,
    body.with-bg .intro-rule,
    body.with-bg .intro-meta,
    body.with-bg .corner,
    body.with-bg .intro-foot {
      display: none
    }

    body.with-bg .intro-kicker {
      margin: 0 0 clamp(12px, 2vh, 18px);
      color: var(--gold-1);
      font-size: clamp(17px, 1.7vw, 22px);
      text-shadow: 0 2px 14px rgba(0, 0, 0, .6)
    }

    body.with-bg .intro-meta {
      margin-bottom: clamp(18px, 3.4vh, 30px)
    }

    body.with-bg .intro-meta dt {
      color: var(--gold-1)
    }

    body.with-bg .intro-meta dd,
    body.with-bg .intro-meta dt {
      text-shadow: 0 1px 10px rgba(0, 0, 0, .7)
    }

    /* top bar moves to the bottom corners so it never covers the picture's logos */
    body.with-bg .topbar {
      top: auto;
      bottom: 0
    }

    @media (max-aspect-ratio: 1/1) {

      /* portrait: show the whole picture at the top, launch details below it */
      .intro-bg {
        background-size: contain;
        background-position: center top;
        background-repeat: no-repeat
      }
    }

    /* invitation-style pre-launch screen */
    .intro-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(14, 17, 30, .45);
      backdrop-filter: blur(8px);
      font: 500 11px/1 var(--sans);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold-1)
    }

    .intro-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-1);
      box-shadow: 0 0 10px var(--gold-1);
      animation: blink 2.4s ease-in-out infinite
    }

    .intro-kicker {
      margin: clamp(18px, 3.4vh, 30px) 0 6px;
      font: italic 400 clamp(15px, 1.5vw, 19px)/1.3 var(--serif);
      color: var(--muted);
      letter-spacing: .02em
    }

    .intro h1 {
      font: 400 clamp(46px, 8vw, 118px)/.94 var(--serif);
      letter-spacing: -.015em;
      text-shadow: 0 10px 60px rgba(0, 0, 0, .5)
    }

    .intro h1 em {
      display: block;
      font-style: italic;
      font-weight: 500;
      padding-bottom: .06em
    }

    .intro-theme {
      margin-top: clamp(12px, 2vh, 18px);
      max-width: 620px;
      font: 300 clamp(14px, 1.35vw, 17px)/1.6 var(--sans);
      letter-spacing: .04em;
      color: rgba(244, 239, 228, .78)
    }

    .intro-rule {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: clamp(16px, 3vh, 26px) 0 clamp(14px, 2.6vh, 22px)
    }

    .intro-rule i {
      width: clamp(50px, 9vw, 110px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-2))
    }

    .intro-rule i:last-child {
      background: linear-gradient(90deg, var(--gold-2), transparent)
    }

    .intro-rule b {
      width: 7px;
      height: 7px;
      background: var(--gold-1);
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(243, 214, 138, .7)
    }

    .intro-meta {
      display: flex;
      align-items: stretch;
      justify-content: center;
      margin-bottom: clamp(24px, 4.6vh, 42px)
    }

    .intro-meta div {
      padding: 0 clamp(16px, 2.6vw, 34px);
      border-left: 1px solid rgba(244, 239, 228, .14)
    }

    .intro-meta div:first-child {
      border-left: 0
    }

    .intro-meta dt {
      font: 500 10px/1 var(--sans);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gold-2);
      margin-bottom: 9px
    }

    .intro-meta dd {
      font: 400 clamp(14px, 1.3vw, 17px)/1.3 var(--serif);
      color: var(--ink);
      white-space: nowrap
    }

    /* thin gold frame corners, like a printed invitation */
    .corner {
      position: absolute;
      width: clamp(28px, 4vw, 54px);
      height: clamp(28px, 4vw, 54px);
      border: 1px solid rgba(243, 214, 138, .45)
    }

    .c-tl { top: 84px; left: clamp(16px, 3vw, 36px); border-right: 0; border-bottom: 0 }
    .c-tr { top: 84px; right: clamp(16px, 3vw, 36px); border-left: 0; border-bottom: 0 }
    .c-bl { bottom: 56px; left: clamp(16px, 3vw, 36px); border-right: 0; border-top: 0 }
    .c-br { bottom: 56px; right: clamp(16px, 3vw, 36px); border-left: 0; border-top: 0 }

    .intro-foot {
      position: absolute;
      left: clamp(16px, 3vw, 36px);
      right: clamp(16px, 3vw, 36px);
      bottom: 20px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font: 500 10px/1.4 var(--sans);
      letter-spacing: .26em;
      text-transform: uppercase;
      color: rgba(244, 239, 228, .42)
    }

    .launch {
      pointer-events: auto;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      border: 0;
      cursor: pointer;
      padding: 21px 30px 21px 46px;
      border-radius: 999px;
      font: 600 13px/1 var(--sans);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: #1b1307;
      background: linear-gradient(135deg, #fbe7a6, #d7a54a 45%, #f3d68a 70%, #b98330);
      box-shadow: 0 0 0 1px rgba(255, 236, 180, .5) inset, 0 18px 50px -10px rgba(215, 165, 74, .55), 0 0 80px -10px rgba(243, 214, 138, .45);
      overflow: hidden;
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s
    }

    .launch:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 0 1px rgba(255, 236, 180, .7) inset, 0 24px 60px -10px rgba(215, 165, 74, .7), 0 0 120px -10px rgba(243, 214, 138, .6)
    }

    .launch:disabled {
      filter: saturate(.3) brightness(.7);
      cursor: wait
    }

    .launch-ico {
      width: 30px;
      height: 30px;
      padding: 7px;
      border-radius: 50%;
      background: rgba(27, 19, 7, .12);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1)
    }

    .launch:hover .launch-ico {
      transform: translateX(4px)
    }

    .launch::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .75) 50%, transparent 65%);
      transform: translateX(-120%);
      animation: sweep 3.2s ease-in-out infinite
    }

    @keyframes sweep {

      60%,
      100% {
        transform: translateX(120%)
      }
    }

    .launch-wrap {
      position: relative;
      pointer-events: auto
    }

    .launch-wrap .ring {
      position: absolute;
      inset: -2px;
      border-radius: 999px;
      border: 1px solid rgba(243, 214, 138, .55);
      animation: ring 2.6s cubic-bezier(.2, .6, .3, 1) infinite;
      pointer-events: none
    }

    .launch-wrap .ring.r2 {
      animation-delay: 1.3s
    }

    @keyframes ring {
      0% {
        transform: scale(1);
        opacity: .9
      }

      100% {
        transform: scale(1.45, 1.9);
        opacity: 0
      }
    }

    .hint {
      margin-top: 18px;
      font: 400 12px var(--sans);
      color: rgba(244, 239, 228, .4);
      letter-spacing: .06em
    }

    kbd {
      font: 500 11px var(--sans);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid rgba(244, 239, 228, .25)
    }

    .countdown {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 12;
      font: 500 clamp(140px, 30vh, 320px)/1 var(--serif);
      opacity: 0
    }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 13;
      opacity: 0;
      background: radial-gradient(circle at 50% 72%, rgba(255, 248, 232, .9) 0%, rgba(243, 214, 138, .45) 30%, rgba(243, 214, 138, 0) 68%)
    }

    .caption {
      position: fixed;
      left: 0;
      right: 0;
      top: clamp(64px, 9vh, 110px);
      text-align: center;
      z-index: 9;
      pointer-events: none;
      padding: 0 16px;
      opacity: 0
    }

    .caption .cap-title {
      display: block;
      margin-top: 12px;
      font: 400 clamp(22px, 2.6vw, 34px)/1.15 var(--serif)
    }

    .caption .cap-title em {
      font-style: italic
    }

    .progress {
      position: fixed;
      left: 50%;
      bottom: clamp(24px, 5vh, 48px);
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 9;
      opacity: 0;
      pointer-events: none
    }

    .progress i {
      width: 26px;
      height: 2px;
      border-radius: 2px;
      background: rgba(244, 239, 228, .2);
      overflow: hidden;
      position: relative
    }

    .progress i.on::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--gold-1);
      box-shadow: 0 0 8px var(--gold-1)
    }

    /* finale */
    .finale {
      position: fixed;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      visibility: hidden
    }

    .finale.show {
      visibility: visible
    }

    /* Finale: book on the left (3D), this panel with a big QR code on the right */
    .fin-panel {
      --qr: clamp(200px, min(26vw, 36vh), 380px);
      position: absolute;
      right: clamp(16px, 6vw, 110px);
      top: 50%;
      transform: translateY(-50%);
      width: min(460px, 44vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2.4vh, 26px);
      text-align: center
    }

    .finale-head {
      opacity: 0
    }

    .fin-panel .finale-head h2 {
      font-size: clamp(26px, min(3.2vw, 5.4vh), 46px);
      white-space: nowrap
    }

    .finale-head h2 {
      margin-top: 12px;
      font: 400 clamp(28px, 4vw, 54px)/1.05 var(--serif)
    }

    .finale-head h2 em {
      font-style: italic
    }

    .finale-head p.by {
      margin-top: 10px;
      font: 300 14px var(--sans);
      color: var(--muted);
      letter-spacing: .06em
    }

    .qr-card {
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 22px 26px 24px;
      border-radius: 28px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .03) inset;
      pointer-events: auto;
      width: max-content;
      max-width: 100%
    }

    .qr-wrap {
      position: relative;
      width: var(--qr);
      height: var(--qr);
      flex: none;
      border-radius: 20px;
      background: #fff;
      padding: calc(var(--qr) * .06);
      box-shadow: 0 0 60px -8px rgba(243, 214, 138, .5)
    }

    .qr-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated
    }

    .qr-wrap .c {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2.5px solid var(--gold-1);
      filter: drop-shadow(0 0 4px rgba(243, 214, 138, .8))
    }

    .qr-wrap .tl {
      top: -7px;
      left: -7px;
      border-right: 0;
      border-bottom: 0;
      border-top-left-radius: 10px
    }

    .qr-wrap .tr {
      top: -7px;
      right: -7px;
      border-left: 0;
      border-bottom: 0;
      border-top-right-radius: 10px
    }

    .qr-wrap .bl {
      bottom: -7px;
      left: -7px;
      border-right: 0;
      border-top: 0;
      border-bottom-left-radius: 10px
    }

    .qr-wrap .br {
      bottom: -7px;
      right: -7px;
      border-left: 0;
      border-top: 0;
      border-bottom-right-radius: 10px
    }

    .qr-wrap .scan {
      position: absolute;
      left: 6px;
      right: 6px;
      top: 6px;
      height: 14%;
      border-radius: 8px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(243, 214, 138, 0), rgba(243, 214, 138, .55) 85%, rgba(255, 240, 200, .95));
      mix-blend-mode: multiply;
      opacity: 0
    }

    .qr-card.scanning .scan {
      opacity: 1;
      animation: scan 2.4s cubic-bezier(.45, 0, .55, 1) infinite
    }

    /* scan line sweeps the full QR height at any QR size */
    @keyframes scan {
      0% {
        top: 6px
      }

      50% {
        top: calc(86% - 6px)
      }

      100% {
        top: 6px
      }
    }

    .qr-info h3 {
      margin: 8px 0 6px;
      font: 400 26px/1.15 var(--serif)
    }

    .qr-info .url {
      font: 400 12px var(--sans);
      color: var(--muted);
      max-width: min(360px, 40vw);
      margin: 0 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 999px;
      font: 600 11px var(--sans);
      letter-spacing: .18em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: transform .25s, background .25s, border-color .25s
    }

    .btn svg {
      width: 14px;
      height: 14px
    }

    .btn.primary {
      color: #1b1307;
      border: 0;
      background: linear-gradient(135deg, #fbe7a6, #d7a54a 55%, #f3d68a)
    }

    .btn.ghost {
      color: var(--ink);
      background: transparent;
      border: 1px solid rgba(244, 239, 228, .25)
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .btn.ghost:hover {
      border-color: var(--gold-1)
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      z-index: 30;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--line);
      font: 400 13px var(--sans);
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: .4s;
      pointer-events: none
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .drop {
      position: fixed;
      inset: 14px;
      border: 1.5px dashed var(--gold-1);
      border-radius: 24px;
      z-index: 40;
      display: grid;
      place-items: center;
      background: rgba(5, 6, 10, .7);
      font: 400 28px var(--serif);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s
    }

    .drop.on {
      opacity: 1
    }

    /* narrow / portrait screens: book on top, panel stacked underneath */
    @media (max-width:760px) {
      .fin-panel {
        --qr: clamp(120px, 34vw, 170px);
        left: 16px;
        right: 16px;
        top: auto;
        bottom: 16px;
        transform: none;
        width: auto;
        gap: 12px
      }

      .finale-head h2 {
        font-size: 26px
      }

      .qr-card {
        flex-direction: row;
        text-align: left;
        gap: 16px;
        padding: 14px 16px 14px 14px;
        border-radius: 22px
      }

      .qr-info .url {
        max-width: 42vw;
        margin: 0
      }

      .actions {
        justify-content: flex-start
      }
    }

    @media (max-width:600px) {
      .qr-info h3 {
        font-size: 19px
      }

      .actions {
        flex-direction: column;
        gap: 8px
      }

      .btn {
        justify-content: center;
        padding: 10px 14px
      }

      .hint {
        display: none
      }

      .intro-meta {
        flex-direction: column;
        gap: 12px
      }

      .intro-chip {
        font-size: 9.5px;
        letter-spacing: .16em;
        padding: 8px 14px 8px 12px
      }

      .intro-meta div {
        border-left: 0;
        padding: 0
      }

    /* ---------- page-edge textures ---------- */
    function edgeTex(horizontal) {

    /* ==========================================================================

       ========================================================================== */
    const bookRoot = new THREE.Group();     // launch flight / final pose

    function pageMaterial(t, side) {

        map: t, color: 0x4d4d4d, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: .78,

    function buildBook() {
      const navy = new THREE.MeshStandardMaterial({ color: 0x0d1734, roughness: .55, metalness: .1 });

      // cover art
      const cc = mkCanvas(CW, CH), pc = mkCanvas(CW, CH);
      drawCover(cc.getContext('2d'), CW, CH, false); drawCover(pc.getContext('2d'), CW, CH, true);
      const coverMap = tex(cc), pbrMap = tex(pc, false);
      const coverMat = new THREE.MeshPhysicalMaterial({
        map: coverMap, metalnessMap: pbrMap, roughnessMap: pbrMap, metalness: 1, roughness: 1,
        clearcoat: .15, clearcoatRoughness: .5, envMapIntensity: 1.2,
        emissive: 0xffffff, emissiveMap: coverMap, emissiveIntensity: .25,
      });
      book.coverCanvas = cc; book.coverPbr = pc; book.coverMat = coverMat;
      const endC = mkCanvas(CW, CH); drawEndpaper(endC.getContext('2d'), CW, CH);
      const endMat = new THREE.MeshStandardMaterial({ map: tex(endC), roughness: .7 });
      const backC = mkCanvas(CW, CH); drawBack(backC.getContext('2d'), CW, CH);
      const backMap = tex(backC);
      const backMat = new THREE.MeshPhysicalMaterial({ map: backMap, roughness: .45, metalness: .15, clearcoat: .3, envMapIntensity: 1.2, emissive: 0xffffff, emissiveMap: backMap, emissiveIntensity: .15 });
      Object.assign(book, { edgeMat: navy, backCanvas: backC, backMat });

      back.position.set((W + OVER) / 2, 0, -BLOCK - CT / 2); back.castShadow = true; bookGroup.add(back);

      const sideV = new THREE.MeshStandardMaterial({ map: eV, roughness: .9 }), sideH = new THREE.MeshStandardMaterial({ map: eH, roughness: .9 });
      const blockC = mkCanvas(PW, PH); PAGES[10](blockC.getContext('2d'));
      const blockTop = pageMaterial(tex(blockC), THREE.FrontSide);
      book.sides[BLOCK_SIDE] = { canvas: blockC, mat: blockTop };

    const xs = new Float32Array(SEG + 1), zs = new Float32Array(SEG + 1);
    function bendLeaf(leaf) {
      const p = leaf.p;

      leaf.last = p;

      pos.needsUpdate = true; leaf.geo.computeVertexNormals(); leaf.geo.computeBoundingSphere();

    /* ==========================================================================

    (function background() {

    const portalU = { charge: .15 };
    const glowMat = new THREE.MeshBasicMaterial({

    const ringMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 2.2, 1.1), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.6, .022, 12, 160), ringMat); ring1.rotation.x = Math.PI / 2; portal.add(ring1);
    const ring2Mat = ringMat.clone(); ring2Mat.opacity = .35;
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.25, .01, 8, 160), ring2Mat); ring2.rotation.x = Math.PI / 2; portal.add(ring2);
    const ticks = new THREE.Group(); portal.add(ticks);
    for (let i = 0; i < 48; i++) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(.025, i % 4 ? .1 : .22), ring2Mat);
      const a = i / 48 * Math.PI * 2; m.position.set(Math.cos(a) * 1.92, .01, Math.sin(a) * 1.92);

    }
    const shock = new THREE.Mesh(new THREE.RingGeometry(.94, 1, 128), new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 3, 1.6), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));

      fragmentShader: `uniform float uOpacity; uniform float uTime; varying vec2 vUv; varying vec3 vN; varying vec3 vV;

      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    }));
    beam.position.y = FLOOR_Y + 7; scene.add(beam);

    /* ==========================================================================
       Particles
       ========================================================================== */
    const PIXEL = { value: renderer.getPixelRatio() };
    const dust = (() => {
      const n = 900, pos = new Float32Array(n * 3), seed = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        pos[i * 3] = (Math.random() - .5) * 30; pos[i * 3 + 1] = FLOOR_Y + Math.random() * 13; pos[i * 3 + 2] = -14 + Math.random() * 13;   // dust stays behind the book, never over the pages seed[i] = Math.random();
      }
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
      const m = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uPixel: PIXEL, uBoost: { value: 0 } },
        vertexShader: `attribute float aSeed; uniform float uTime; uniform float uPixel; uniform float uBoost; varying float vA;
      void main(){ vec3 p=position; float t=uTime*(.25+aSeed*.4);

        vec4 mv=modelViewMatrix*vec4(p,1.); gl_PointSize=(6.+aSeed*16.)*uPixel*(1.+uBoost)/-mv.z*4.;

        fragmentShader: `varying float vA; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,0.,d); gl_FragColor=vec4(vec3(1.,.84,.58)*1.4,clamp(a*a*vA*.3,0.,1.));

    class Sparks {
      constructor(n) {
        this.n = n; this.cur = 0;
        this.pos = new Float32Array(n * 3).fill(999); this.vel = new Float32Array(n * 3);
        this.life = new Float32Array(n); this.decay = new Float32Array(n); this.grav = new Float32Array(n); this.size = new Float32Array(n);
        const g = new THREE.BufferGeometry();
        this.aPos = new THREE.BufferAttribute(this.pos, 3); this.aLife = new THREE.BufferAttribute(this.life, 1);
        g.setAttribute('position', this.aPos); g.setAttribute('aLife', this.aLife); g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
        this.sizeAttr = g.attributes.aSize;
        const m = new THREE.ShaderMaterial({
          uniforms: { uPixel: PIXEL },
          vertexShader: `attribute float aLife; attribute float aSize; uniform float uPixel; varying float vL;
        void main(){ vL=aLife; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=aSize*uPixel*(.3+aLife)*60./-mv.z; gl_Position=projectionMatrix*mv; }`,
          fragmentShader: `varying float vL; void main(){ float d=length(gl_PointCoord-.5); if(d>.5) discard; float a=smoothstep(.5,0.,d);

          transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,

      emit(count, o, { spread = .2, vel, decay = .6, grav = 4, size = 1 }) {

        for (let k = 0; k < count; k++) {
          const i = this.cur; this.cur = (i + 1) % this.n;
          this.pos[i * 3] = o.x + (Math.random() - .5) * spread * (o.sx || 1);
          this.pos[i * 3 + 1] = o.y + (Math.random() - .5) * spread * (o.sy || 1);

        }

      }
      update(dt) {

          for (let a = 0; a < 3; a++) { this.vel[i * 3 + a] *= drag; this.pos[i * 3 + a] += this.vel[i * 3 + a] * dt; }
          this.life[i] = Math.max(0, this.life[i] - this.decay[i] * dt);
        }

      }
    }
    const sparks = new Sparks(2600);

    const confetti = (() => {
      const n = 280, geo = new THREE.PlaneGeometry(.07, .13);

      const mesh = new THREE.InstancedMesh(geo, mat, n); mesh.frustumCulled = false; scene.add(mesh);

      const P = [], dummy = new THREE.Object3D();

    /* ==========================================================================

    const FR = {

    const qrCanvas = $('qr'), qrCtx = qrCanvas.getContext('2d'), qrData = makeQR(CONFIG.qrUrl), qrAnim = { t: 0 };
    function drawQR() {
      const S = qrCanvas.width; qrCtx.fillStyle = '#fff'; qrCtx.fillRect(0, 0, S, S);
      if (!qrData) { qrCtx.fillStyle = '#121a33'; qrCtx.font = '20px Inter'; qrCtx.textAlign = 'center'; qrCtx.fillText('QR unavailable', S / 2, S / 2); return; }
      const n = qrData.n, m = S / n, maxD = Math.hypot(n / 2, n / 2), T = qrAnim.t * 1.35;
      qrCtx.fillStyle = '#121a33';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        if (!qrData.dark(r, c)) continue;
        const d = Math.hypot(r - n / 2, c - n / 2) / maxD, k = Math.min(1, Math.max(0, (T - d) / .35));
        if (k <= 0) continue;
        const e = 1 - Math.pow(1 - k, 3), s = m * e;

      }
    }
    drawQR();

    /* ==========================================================================
       Sequence
       ========================================================================== */
    const state = { phase: 'loading', cover: 0, open: 0, float: 0, trail: false };
    let master = null;

    function ignite() {
      Sfx.boom();
      // soft golden bloom of light — rises and falls smoothly instead of a hard white strobe
      gsap.timeline()
        .to(flashEl, { opacity: .6, duration: .12, ease: 'power1.out' })
        .to(flashEl, { opacity: 0, duration: 1.3, ease: 'power2.out' });
      gsap.fromTo(shock.scale, { x: 1, y: 1, z: 1 }, { x: 10, y: 10, z: 10, duration: 1.8, ease: 'expo.out' });
      gsap.fromTo(shock.material, { opacity: 1 }, { opacity: 0, duration: 1.8, ease: 'power2.out' });
      gsap.fromTo(dust.uniforms.uBoost, { value: 1.5 }, { value: 0, duration: 3, ease: 'power2.out' });
      const o = { x: 0, y: FLOOR_Y + .1, z: 0 };
      sparks.emit(1100, o, { spread: .6, decay: .45, grav: 4.5, size: 1, vel: v => { const a = Math.random() * 6.283, r = 1 + Math.random() * 6; v.set(Math.cos(a) * r, 4 + Math.random() * 12, Math.sin(a) * r); } });
      sparks.emit(500, o, { spread: .2, decay: .9, grav: 0, size: .8, vel: v => { const a = Math.random() * 6.283, r = 7 + Math.random() * 7; v.set(Math.cos(a) * r, .2 + Math.random() * .6, Math.sin(a) * r); } });
    }

    function launch() {
      if (state.phase !== 'idle') return;
      state.phase = 'running'; Sfx.init();
      const tl = master = gsap.timeline();
      tl.to(introEl, { autoAlpha: 0, y: -24, duration: .6, ease: 'power2.in' }, 0);
      // the launch picture dissolves into the dark 3D stage; top bar returns to the top
      tl.to(introBg, { autoAlpha: 0, scale: 1.04, duration: 1.4, ease: 'power2.inOut' }, 0);
      tl.call(() => document.body.classList.remove('with-bg'), null, 1.4);
      // countdown: N … 1, one number per second, then ignition
      const N = Math.max(1, CONFIG.countdown || 3), STEP = 1, C0 = .6;
      const T = C0 + N * STEP;
      tl.to(frame, { ...FR.intro, y: -1.2, h: 7.6, duration: T - .4, ease: 'power1.inOut' }, 0);
      tl.to(portalU, { charge: 1, duration: T - .4, ease: 'power2.in' }, .2);
      tl.call(() => Sfx.whoosh(.18), null, Math.max(.4, T - 3));
      for (let i = 0; i < N; i++) { const n = N - i; tl.call(() => showCount(n), null, C0 + i * STEP); }

      tl.call(ignite, null, T);
      tl.to(key, { intensity: KEY_ON, duration: 1.4, ease: 'power2.out' }, T);
      tl.set(bookRoot, { visible: true }, T);
      tl.fromTo(bookRoot.position, { y: -7.5 }, { y: 0, duration: 2.8, ease: 'expo.out' }, T);
      tl.fromTo(bookRoot.rotation, { x: .5, y: -Math.PI * 2, z: .15 }, { x: 0, y: 0, z: 0, duration: 3.6, ease: 'power3.out' }, T);
      tl.fromTo(bookRoot.scale, { x: .45, y: .45, z: .45 }, { x: 1, y: 1, z: 1, duration: 2.4, ease: 'expo.out' }, T);
      tl.to(frame, { ...FR.closed, duration: 2.8, ease: 'power3.inOut' }, T - .2);
      tl.set(state, { trail: true }, T); tl.set(state, { trail: false }, T + 1.8);
      // beam in & out on the same timeline, so a slow frame can never leave it stuck on
      tl.fromTo(beam.material.uniforms.uOpacity, { value: 0 }, { value: 1, duration: .25, ease: 'power2.out', immediateRender: false }, T);
      tl.to(beam.material.uniforms.uOpacity, { value: 0, duration: 1.8, ease: 'power2.inOut' }, T + .6);
      tl.to(portalU, { charge: .2, duration: 2.5 }, T + .8);
      tl.to(state, { float: 1, duration: 1.5 }, T + 2.6);
      tl.call(() => { setCaption('Introducing', `<em>${titleOneLine}</em>`); Sfx.chime(); }, null, T + 2.2);

      const O = T + 4.6;   // open the cover
      tl.call(() => Sfx.flip(.5), null, O);
      tl.to(state, { cover: 1, open: 1, duration: 1.8, ease: 'power2.inOut' }, O);
      tl.to(frame, { ...FR.open, duration: 1.8, ease: 'power2.inOut' }, O);
      tl.call(() => spreadCaption(0), null, O + 1.1);

      const HOLD = CONFIG.pageHold || 2.1;   // seconds each open spread stays on screen
      let t = O + 1.8 + HOLD;
      for (let i = 0; i < LEAVES; i++) {
        tl.call(() => Sfx.flip(), null, t);
        tl.to(book.leaves[i], { p: 1, duration: 1.35, ease: 'power2.inOut' }, t);
        tl.call(() => spreadCaption(i + 1), null, t + .75);
        t += 1.35 + HOLD;
      }

      // close the book with a fanned cascade
      tl.call(() => { hideCaption(); Sfx.whoosh(.35); }, null, t);
      for (let k = 0; k < LEAVES; k++) tl.to(book.leaves[LEAVES - 1 - k], { p: 0, duration: 1, ease: 'power2.inOut' }, t + k * .08);
      const tc = t + LEAVES * .08;
      tl.to(state, { cover: 0, open: 0, duration: 1.15, ease: 'power2.inOut' }, tc);
      tl.to(frame, { ...FR.closed, duration: 1.15, ease: 'power2.inOut' }, tc);
      tl.call(runFinale, null, tc + 1.15);
    }

    function placement() {
      const f = FR.final, D = fitDistance(f.w, f.h);
      const wpp = 2 * D * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / innerHeight;
      const pr = panelEl.getBoundingClientRect();
      let cx, cy, availW, availH;
      if (innerWidth > 760) {          // side by side: book centred in the space left of the panel
        cx = pr.left / 2; cy = innerHeight / 2 + 10;
        availW = pr.left - 40; availH = innerHeight - 150;
      } else {                         // stacked: book centred above the panel
        const top = 70, bot = pr.top - 16;
        cx = innerWidth / 2; cy = (top + bot) / 2;
        availW = innerWidth - 32; availH = Math.max(bot - top, 120);
      }
      return {
        x: (cx - innerWidth / 2) * wpp,
        y: (innerHeight / 2 - cy) * wpp + f.y,
        s: Math.min(1.5, availH * wpp * .88 / (H + 2 * OVER), availW * wpp * .8 / (W + OVER)),
      };
    }

    function runFinale() {
      state.phase = 'final';
      finaleEl.classList.add('show');
      const pl = placement();
      gsap.to(frame, { ...FR.final, duration: 1.8, ease: 'power3.inOut' });
      gsap.to(bookRoot.position, { x: pl.x, y: pl.y, duration: 1.8, ease: 'power3.inOut' });
      gsap.to(beam.material.uniforms.uOpacity, { value: 0, duration: .6 });   // safety: no beam in the finale
      // the glowing floor oval travels with the book and settles right underneath it
      gsap.to(portal.position, { x: pl.x, duration: 1.8, ease: 'power3.inOut' });
      gsap.to(portal.scale, { x: pl.s, y: pl.s, z: pl.s, duration: 1.8, ease: 'power3.inOut' });
      gsap.to(portalU, { charge: .5, duration: 1.4, delay: 1, ease: 'power2.out' });
      gsap.to(bookRoot.scale, { x: pl.s, y: pl.s, z: pl.s, duration: 1.8, ease: 'power3.inOut' });
      gsap.to(bookRoot.rotation, { y: .42, x: .05, duration: 2, ease: 'power3.inOut' });
      const side = innerWidth > 760;   // panel slides in from the right (or up, when stacked)
      gsap.fromTo(headEl, { autoAlpha: 0, x: side ? 40 : 0, y: side ? 0 : 20 }, { autoAlpha: 1, x: 0, y: 0, duration: 1.1, delay: .7, ease: 'expo.out' });
      gsap.fromTo(cardEl, { autoAlpha: 0, x: side ? 80 : 0, y: side ? 0 : 50, scale: .94 }, { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 1.3, delay: .95, ease: 'expo.out' });
      qrAnim.t = 0; drawQR();
      gsap.to(qrAnim, { t: 1, duration: 1.7, delay: 1.2, ease: 'power1.out', onUpdate: drawQR, onStart: () => Sfx.chime(), onComplete: () => cardEl.classList.add('scanning') });
      gsap.delayedCall(.9, () => {
        confetti.start();
        const wp = new THREE.Vector3(); bookRoot.getWorldPosition(wp);
        sparks.emit(500, wp, { spread: 1.2, decay: .7, grav: 1.5, size: .7, vel: v => v.set((Math.random() - .5) * 8, (Math.random() - .3) * 8, (Math.random() - .5) * 6) });
      });
      gsap.delayedCall(9, () => { confetti.on = false; });
    }

    function reset() {
      master?.kill();
      gsap.killTweensOf([frame, state, portalU, portal.position, portal.scale, bookRoot.position, bookRoot.rotation, bookRoot.scale, qrAnim, headEl, cardEl, capEl, progressEl, ...book.leaves]);
      gsap.globalTimeline.getChildren(false, true, true).forEach(c => c.kill());   // incl. pending delayedCalls
      state.cover = 0; state.open = 0; state.float = 0; state.trail = false;
      book.leaves.forEach(l => { l.p = 0; });
      bookRoot.visible = false; bookRoot.position.set(0, -7.5, 0); bookRoot.rotation.set(0, 0, 0); bookRoot.scale.setScalar(1);
      finaleEl.classList.remove('show'); cardEl.classList.remove('scanning');
      gsap.set([headEl, cardEl], { autoAlpha: 0 }); gsap.set([capEl, progressEl], { opacity: 0 });
      confetti.on = false; portalU.charge = .15; beam.material.uniforms.uOpacity.value = 0;
      gsap.killTweensOf(key); key.intensity = KEY_IDLE;
      portal.position.x = 0; portal.scale.setScalar(1);   // oval back to centre stage for a replay
      Object.assign(frame, introFrame());
      state.phase = 'idle';
    }

    launchBtn.addEventListener('click', launch);
    // no on-screen Replay button: press R at the finale to run the launch again (handy for rehearsals)
    addEventListener('keydown', e => { if (e.code === 'KeyR' && state.phase === 'final') { reset(); gsap.delayedCall(.2, launch); } });
    addEventListener('keydown', e => {
      if ((e.code === 'Space' || e.code === 'Enter') && e.target !== launchBtn && state.phase === 'idle') { e.preventDefault(); launch(); }
    });

    /* ==========================================================================
       PDF support — renders your real pages onto the book (pdf.js)
       ========================================================================== */
    // Put the book's real cover artwork on the 3D book: front (no foil, true colours), spine and
    // cover edges in the cover's colours, and the back cover. Used by the embedded covers and the PDF.
    function applyCovers(front, back) {
      const coverFit = (c, im) => {
        const x = c.getContext('2d'), s = Math.max(CW / im.width, CH / im.height);
        x.fillStyle = '#0e1836'; x.fillRect(0, 0, CW, CH);
        x.drawImage(im, (CW - im.width * s) / 2, (CH - im.height * s) / 2, im.width * s, im.height * s);
      };
      if (front) {
        coverFit(book.coverCanvas, front);
        const pc = book.coverPbr.getContext('2d'); pc.fillStyle = 'rgb(0,120,0)'; pc.fillRect(0, 0, CW, CH);
        book.coverMat.map.needsUpdate = true; book.coverMat.metalnessMap.needsUpdate = true;
        book.coverMat.emissiveIntensity = .55; book.coverMat.clearcoat = .08;   // printed cover: true colours, little glare
        drawSpine(book.spineCanvas.getContext('2d'), book.spineCanvas.width, book.spineCanvas.height, front);
        book.spineMat.map.needsUpdate = true;
        const px = mkCanvas(1, 1), pxc = px.getContext('2d'); pxc.drawImage(front, 0, 0, front.width * .05, front.height, 0, 0, 1, 1);
        const [r, g, b] = pxc.getImageData(0, 0, 1, 1).data;
        book.edgeMat.color.setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace);
      }
      if (back) {
        coverFit(book.backCanvas, back);
        book.backMat.map.needsUpdate = true; book.backMat.emissiveIntensity = .5; book.backMat.clearcoat = .08;
      }
    }
    // Put a real book page (image/canvas) on preview side i: paper margin, page, gutter shadow.
    function applyPage(i, pimg) {
      const side = book.sides[i], left = i % 2 === 1 && i !== BLOCK_SIDE;
      // drawn at 1.5× resolution so the book's small text stays legible
      const HR = 1.5, big = mkCanvas(Math.round(PW * HR), Math.round(PH * HR)), c = big.getContext('2d');
      c.scale(HR, HR); c.imageSmoothingQuality = 'high';
      paper(c, left);
      const k = Math.min((PW - 40) / pimg.width, (PH - 40) / pimg.height), w = pimg.width * k, h = pimg.height * k;
      c.drawImage(pimg, (PW - w) / 2, (PH - h) / 2, w, h);
      const gx = left ? PW : 0, g = c.createLinearGradient(gx, 0, left ? PW - 110 : 110, 0);
      g.addColorStop(0, 'rgba(60,40,20,.18)'); g.addColorStop(1, 'rgba(60,40,20,0)'); c.fillStyle = g; c.fillRect(0, 0, PW, PH);
      setSideCanvas(i, big);
    }
    function setSideCanvas(i, big) {
      const side = book.sides[i], old = side.mat.map, nt = tex(big);
      nt.wrapS = old.wrapS; nt.repeat.copy(old.repeat); nt.offset.copy(old.offset);
      side.mat.map = nt; side.mat.emissiveMap = nt; side.mat.needsUpdate = true; side.canvas = big; old.dispose();
    }

    function wrapLines(ctx, text, maxW) {
      const lines = []; let line = '';
      for (const word of text.split(/\s+/)) {
        const test = line ? line + ' ' + word : word;
        if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; } else line = test;
      }
      if (line) lines.push(line);
      return lines;
    }

    // A designed page for one panel: its number, its name and every research topic with its page number.
    function drawPanelPage(ctx, panel, left) {
      paper(ctx, left);
      const x0 = MX - 10, x1 = PW - MX + 10, w = x1 - x0;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#8a7a64'; ctx.font = `500 15px ${FONT.sans}`; spacing(ctx, 6);
      ctx.fillText(`${CONFIG.coverTag} · ${titleOneLine}`.toUpperCase(), PW / 2, 84); spacing(ctx, 0);

      // panel label + name
      ctx.fillStyle = ACCENT; ctx.font = `600 19px ${FONT.sans}`; spacing(ctx, 10);
      ctx.fillText(`PANEL ${panel.no}`, PW / 2, 150); spacing(ctx, 0);
      let ns = 54, nameLines;
      do { ctx.font = `400 ${ns}px ${FONT.serif}`; nameLines = wrapLines(ctx, panel.name, w - 60); ns -= 2; } while (nameLines.length > 2 && ns > 34);
      ctx.fillStyle = INK; let y = 150 + ns * 1.25;
      nameLines.forEach(l => { ctx.fillText(l, PW / 2, y); y += ns * 1.12; });
      divider(ctx, PW / 2, y - ns * .3 + 14, 80, ACCENT);
      y += 34;

      // topics, auto-sized so the whole list fits on the page
      const top = y, bottom = PH - 112, numW = 58, pageW = 58, tw = w - numW - pageW;
      let f = 30, layout;
      const measure = (size) => {
        ctx.font = `400 ${size}px ${FONT.body}`;
        const items = panel.topics.map(([t]) => wrapLines(ctx, t, tw));
        const lh = size * 1.22, gap = size * .62;
        const h = items.reduce((s, ls) => s + ls.length * lh, 0) + gap * (items.length - 1);
        return { items, lh, gap, h, size };
      };
      do { layout = measure(f); f -= .5; } while (layout.h > bottom - top && f > 14);
      const { items, lh, gap, size } = layout;
      y = top + Math.min(40, Math.max(0, (bottom - top - layout.h) / 2)) + size;   // short lists sit under the title
      items.forEach((ls, k) => {
        ctx.textAlign = 'left'; ctx.fillStyle = ACCENT; ctx.font = `italic 500 ${size * 1.05}px ${FONT.serif}`;
        ctx.fillText(String(k + 1).padStart(2, '0'), x0, y);
        ctx.fillStyle = INK; ctx.font = `400 ${size}px ${FONT.body}`;
        ls.forEach((l, j) => ctx.fillText(l, x0 + numW, y + j * lh));
        ctx.textAlign = 'right'; ctx.fillStyle = '#8a7a64'; ctx.font = `500 ${size * .8}px ${FONT.sans}`;
        ctx.fillText(String(panel.topics[k][1]), x1, y + (ls.length - 1) * lh);
        y += ls.length * lh + gap;
        if (k < items.length - 1) {
          ctx.fillStyle = 'rgba(154,116,50,.18)'; ctx.fillRect(x0 + numW, y - gap * .5 - size * .85, tw + pageW, 1);
        }
      });

      ctx.textAlign = 'center'; ctx.fillStyle = ACCENT; ctx.font = `500 15px ${FONT.sans}`; spacing(ctx, 7);
      ctx.fillText(`${panel.topics.length} RESEARCH PAPERS`, PW / 2, PH - 62); spacing(ctx, 0);
    }
    function applyPanelPages() {
      (CONFIG.pdfPages?.sides || []).forEach((tok, i) => {
        const m = /^P(\d+)$/.exec(tok), panel = m && CONFIG.panels?.[m[1] - 1];
        if (!panel || i >= book.sides.length) return;
        const HR = 1.5, big = mkCanvas(Math.round(PW * HR), Math.round(PH * HR)), c = big.getContext('2d');
        c.scale(HR, HR);
        drawPanelPage(c, panel, i % 2 === 1 && i !== BLOCK_SIDE);
        setSideCanvas(i, big);
      });
    }

    const loadImg = (u) => u ? new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = u; }) : null;
    async function applyEmbeddedCovers() {
      const src = window.BOOK_COVERS; if (!src) return;
      const [front, back] = await Promise.all([loadImg(src.front), loadImg(src.back)]);
      applyCovers(front, back);
    }
    // Real pages from book.pdf, embedded in book-pages.js, so the turning pages always match the book.
    // Returns true when every preview page was filled.
    async function applyEmbeddedPages() {
      const src = window.BOOK_PAGES; if (!src || !src.length) return false;
      const imgs = await Promise.all(src.map(loadImg));
      imgs.forEach((im, i) => { if (im && i < book.sides.length) applyPage(i, im); });
      // complete when every numbered PDF page in the list has its image (designed panel pages don't need one)
      return (CONFIG.pdfPages?.sides || []).every((tok, i) => typeof tok !== 'number' || imgs[i]);
    }

    function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
    async function loadPdf(source, name) {
      try {
        toast('Loading PDF pages…', 10000);
        if (!window.pdfjsLib) {
          await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        const doc = await pdfjsLib.getDocument(typeof source === 'string' ? { url: source } : { data: source }).promise;
        const render = async (n) => {
          const page = await doc.getPage(n), v1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 2200 / v1.height });
          const c = mkCanvas(Math.round(vp.width), Math.round(vp.height));
          await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; return c;
        };
        const PP = CONFIG.pdfPages || {};
        const backN = PP.back || doc.numPages;
        applyCovers(await render(PP.cover || 1), backN > 1 && backN <= doc.numPages ? await render(backN) : null);
        // interior pages
        const sides = PP.sides || book.sides.map((_, i) => i + 2);
        for (let i = 0; i < book.sides.length; i++) {
          const n = sides[i]; if (typeof n !== 'number' || n > doc.numPages) continue;
          applyPage(i, await render(n));
        }
        pdfLoaded = true; toast(`Loaded “${name || source}” · ${doc.numPages} pages`);
      } catch (err) {
        console.error(err); toast('Could not load the PDF — using the designed preview pages instead.');
      }
    }
    const dropEl = $('drop');
    addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('on'); });
    addEventListener('dragleave', e => { if (e.relatedTarget === null) dropEl.classList.remove('on'); });
    addEventListener('drop', async e => {
      e.preventDefault(); dropEl.classList.remove('on');
      const f = [...e.dataTransfer.files].find(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
      if (f) loadPdf(new Uint8Array(await f.arrayBuffer()), f.name); else toast('Please drop a PDF file.');
    });

    /* ==========================================================================
       Loop
       ========================================================================== */
    // Rendered from GSAP's ticker so every tween is updated before the frame is drawn (no 1-frame jitter).
    function frameLoop(time, deltaMs) {
      const dt = Math.min(deltaMs / 1000, .05), t = time;

      // book mechanics
      for (const l of book.leaves) bendLeaf(l);
      if (book.coverPivot) {
        const c = state.cover, s = c * c * (3 - 2 * c);
        book.coverPivot.rotation.y = -c * Math.PI;
        book.coverPivot.position.z = ((LEAVES + 1) * GAP + CT / 2) * (1 - s) + (-CT / 2 - .001) * s;
      }
      bookGroup.position.x = -W / 2 * (1 - state.open);
      floatGroup.position.y = Math.sin(t * 1.1) * .07 * state.float;
      floatGroup.rotation.y = Math.sin(t * .55) * .045 * state.float;
      floatGroup.rotation.x = Math.sin(t * .8) * .015 * state.float;

      if (state.trail) {
        const wp = new THREE.Vector3(); bookRoot.getWorldPosition(wp); wp.sx = 3; wp.sy = 4;
        sparks.emit(14, wp, { spread: 1, decay: 1.1, grav: -.6, size: .6, vel: v => v.set((Math.random() - .5) * 1.2, -1 - Math.random() * 2, (Math.random() - .5) * 1.2) });
      }

      // stage
      const ch = portalU.charge, pulse = .85 + .15 * Math.sin(t * 2.2);
      glowMat.opacity = (.12 + ch * .7) * pulse;
      ringMat.color.setRGB(1.2 + ch * 3, .9 + ch * 2.2, .45 + ch * 1.1);
      ring1.scale.setScalar(1 + Math.sin(t * 1.6) * .015);
      ticks.rotation.y = t * (.08 + ch * .9);
      beam.material.uniforms.uTime.value = t;
      dust.uniforms.uTime.value = t;
      sparks.update(dt);
      confetti.update(dt, t);

      // camera
      const damp = 1 - Math.exp(-dt * 2.2);   // frame-rate independent easing
      mouse.x += (mouse.tx - mouse.x) * damp; mouse.y += (mouse.ty - mouse.y) * damp;
      const D = fitDistance(frame.w, frame.h);
      camera.position.set(mouse.x * 1.1, frame.y + .45 - mouse.y * .6, D);
      camera.lookAt(0, frame.y, 0);
      scene.fog.near = D + 4; scene.fog.far = D + 26;   // keep the book crisp at any aspect ratio
      key.position.set(4 + mouse.x * 2, 8, 10);

      renderer.render(scene, camera);
      if (!shown) { shown = true; requestAnimationFrame(() => canvas.classList.add('ready')); }
    }
    let shown = false;

    // Upload every texture and compile every shader up front, so the book's first appearance doesn't hitch.
    function warmUp() {
      const was = bookRoot.visible; bookRoot.visible = true;
      scene.traverse(o => {
        if (!o.material) return;
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
          ['map', 'emissiveMap', 'metalnessMap', 'roughnessMap'].forEach(k => { if (m[k]) renderer.initTexture(m[k]); });
        });
      });
      renderer.compile(scene, camera);   // compile only — never present a warm-up frame on screen
      bookRoot.visible = was;
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      PIXEL.value = renderer.getPixelRatio();
      renderer.render(scene, camera);   // resizing clears the canvas — redraw now so there's no black frame
      if (state.phase === 'idle') Object.assign(frame, introFrame());
      if (state.phase === 'final') { const pl = placement(); bookRoot.position.x = pl.x; bookRoot.position.y = pl.y; bookRoot.scale.setScalar(pl.s); portal.position.x = pl.x; portal.scale.setScalar(pl.s); }
    });

    /* ==========================================================================
       Boot
       ========================================================================== */
    await Promise.race([
      Promise.all(['700 64px "Playfair Display"', 'italic 400 40px "Playfair Display"', '400 30px "EB Garamond"', 'italic 400 30px "EB Garamond"', '500 30px Inter', '600 30px Inter']
        .map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 3000)),
    ]);
    buildBook();
    await applyEmbeddedCovers();   // real cover straight away, no PDF needed
    const pagesReady = await applyEmbeddedPages();   // real turning pages, no PDF needed
    if (pagesReady) pdfLoaded = true;
    applyPanelPages();   // one designed page per panel with all its topics
    gsap.ticker.add(frameLoop);
    gsap.from(introEl.children, { opacity: 0, y: 24, duration: 1.2, stagger: .12, ease: 'expo.out' });
    // No embedded pages? Load the PDF *before* enabling launch, so page rendering never competes with the animation.
    if (CONFIG.pdfUrl && !pagesReady) await loadPdf(CONFIG.pdfUrl);
    warmUp();
    launchBtn.disabled = false; setLaunchLabel('Launch the Book');
    state.phase = 'idle';
  </script>
</body>

</html>
